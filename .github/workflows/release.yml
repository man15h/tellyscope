name: Release

on:
  push:
    branches: [main, dev]
    # Alpha tags only. Prod's vX.Y.Z tags have no "-alpha." and don't match.
    tags: ['v*-alpha.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A push to dev publishes an alpha only when it came from a PR into dev whose
  # title contains [release]; anything else ends here, green. No secrets in this
  # job, and the title only ever reaches jq, never a shell.
  alpha-gate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.marker.outputs.publish }}
    steps:
      - name: "[release] in the PR title"
        id: marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GitHub links a merge commit to its PR a few seconds after the push, and
        # this run often starts first: an empty answer means "not yet", so ask
        # again (6 tries, 10 s apart) until a merged PR into dev turns up.
        run: |
          for try in 1 2 3 4 5 6; do
            PUBLISH=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
              '[.[] | select(.base.ref == "dev" and .merged_at != null)]
               | if length == 0 then "" else any(.[]; .title | ascii_downcase | contains("[release]")) end') || PUBLISH=
            [ -n "$PUBLISH" ] && break
            [ "$try" -lt 6 ] && echo "No merged PR linked to ${GITHUB_SHA::7} yet (try $try of 6); asking again in 10 s" && sleep 10
          done
          if [ "$PUBLISH" != true ]; then
            echo "::notice::No merged PR into dev with [release] in its title for ${GITHUB_SHA::7}; no alpha this time"
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  # Alpha: publishes the next v<versionName>-alpha.N as a pre-release for a
  # [release] merge into dev; pushing such a tag on a dev commit by hand does the
  # same for that tag. app.tellyscope.alpha installs next to the release build.
  alpha:
    needs: alpha-gate
    # always(): a tag push skips the gate, and a skipped need would skip this job too.
    if: always() && (github.ref_type == 'tag' || needs.alpha-gate.outputs.publish == 'true')
    runs-on: ubuntu-latest
    # Its own key, in its own Environment: an alpha can never update a prod install, and a dev
    # push never sees the prod key.
    environment: alpha
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, and dev for the check below

      - name: Tag
        id: tag
        run: |
          NAME=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            # A push to dev: one past the highest alpha of this version. The tag
            # is pushed only after the build passes, in the pre-release step.
            LAST=$(git tag -l "v$NAME-alpha.*" | sed 's/.*-alpha\.//' | grep -E '^[0-9]+$' | sort -n | tail -n 1)
            N=$(( ${LAST:-0} + 1 ))
            echo "tag=v$NAME-alpha.$N" >> "$GITHUB_OUTPUT"
            echo "n=$N" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="$GITHUB_REF_NAME"
          N="${TAG##*-alpha.}"
          if ! [[ "$N" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::$TAG must end in -alpha.<number>, like v0.1.0-alpha.1"
            exit 1
          fi
          V="${TAG#v}"; V="${V%-alpha.*}"
          if [ "$V" != "$NAME" ]; then
            echo "::error::$TAG is version $V, but versionName in app/build.gradle.kts is $NAME; tag v$NAME-alpha.<number> instead"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/dev; then
            echo "::error::$TAG is not on dev; alpha tags go on dev commits only"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      # JDK 25: Kadb ships Java 25 bytecode.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # No fallback to the release key: without the alpha secrets the job fails.
      - name: Keystore
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ALPHA_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ALPHA_KEYSTORE_BASE64 is not set in the alpha environment; see CONTRIBUTING.md#releases"
            exit 1
          fi
          printf '%s' "$ALPHA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alpha.jks"

      # Gradle reads the RELEASE_* names for whichever key the job hands it.
      - name: Build
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/alpha.jks
          RELEASE_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease -Ptellyscope.alpha=${{ steps.tag.outputs.n }} --console=plain

      - name: Alpha pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          APK="Tellyscope-$TAG.apk"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$APK"
          # The nearest tag before this commit, alpha or prod; a glob would find the tag just pushed.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "Alpha build $TAG from \`${GITHUB_SHA::7}\` on dev. Untested and may break; it installs as a separate app, \`app.tellyscope.alpha\`."
            echo
            echo "### Commits since ${PREV:-the first commit}"
            echo
            git log --no-merges --pretty='- %s (%h)' ${PREV:+"$PREV.."}HEAD
          } > notes.md
          gh release create "$TAG" "$APK" --prerelease --verify-tag \
            --title "Tellyscope $TAG" --notes-file notes.md

  # Prod: a merge into main tags vX.Y.Z from versionName and publishes the
  # signed APK. release-check.yml has already made sure the version is new.
  prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      new: ${{ steps.version.outputs.new }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags

      - name: Version
        id: version
        run: |
          V=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::notice::v$V is already released; nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.new == 'true'

      - name: Keystore
        if: steps.version.outputs.new == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set in the release environment; see CONTRIBUTING.md#releases"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        if: steps.version.outputs.new == 'true'
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease --console=plain

      # Notes: the version's CHANGELOG.md section, then every commit since the
      # previous tag.
      - name: Tag and release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          PREV=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          awk -v v="$V" '
            /^## / { if (on) exit; h = $0; sub(/^## v?/, "", h); split(h, a, /[ \t]/); on = (a[1] == v); next }
            on
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Commits since ${PREV:-the first commit}"
            echo
            git log --no-merges --pretty='- %s (%h)' ${PREV:+"$PREV.."}HEAD
          } >> notes.md
          APK="Tellyscope-$V.apk"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$APK"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" "$APK" --title "Tellyscope $V" --notes-file notes.md --verify-tag

  # Play: the same tag built as the play flavor, an app bundle signed with the
  # release key, attached to the release prod just published. Its own job, so a
  # failed bundle never holds back the APK.
  play:
    needs: prod
    if: needs.prod.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prod.outputs.version }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set in the release environment; see CONTRIBUTING.md#releases"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayRelease --console=plain

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.prod.outputs.version }}
        run: |
          AAB="Tellyscope-$V-play.aab"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$AAB"
          gh release upload "v$V" "$AAB"
